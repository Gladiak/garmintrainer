name: Check encrypted secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  git-crypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check encrypted blobs and excluded unlock keys
        run: node scripts/check-secrets.mjs --history
